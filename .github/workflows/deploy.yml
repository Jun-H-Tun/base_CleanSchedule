name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply cleanschedule-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync Worker secrets (JWT_SECRET / INGEST_API_KEY)
        run: |
          if [ -n "$JWT_SECRET" ]; then
            echo "$JWT_SECRET" | npx wrangler secret put JWT_SECRET
          else
            echo "::warning::JWT_SECRET repository secret is not set yet - skipping. Add it in Settings > Secrets and variables > Actions, then re-run this workflow."
          fi
          if [ -n "$INGEST_API_KEY" ]; then
            echo "$INGEST_API_KEY" | npx wrangler secret put INGEST_API_KEY
          else
            echo "::warning::INGEST_API_KEY repository secret is not set - skipping (optional, only needed for the beds24 sync endpoint)."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
