<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanSchedule - 民泊清掃管理</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- ログイン画面 -->
  <div id="login-screen" class="screen">
    <div class="login-card">
      <h1>🧹 CleanSchedule</h1>
      <p class="subtitle">民泊清掃管理システム</p>
      <form id="login-form">
        <label>ユーザー名<input type="text" id="login-username" required autocomplete="username" /></label>
        <label>パスワード<input type="password" id="login-password" required autocomplete="current-password" /></label>
        <button type="submit">ログイン</button>
        <p id="login-error" class="error-text" hidden></p>
      </form>
    </div>
  </div>

  <!-- アプリ本体 -->
  <div id="app-screen" class="screen" hidden>
    <header class="app-header">
      <div class="brand">🧹 CleanSchedule</div>
      <nav class="tabs">
        <button class="tab-btn" data-view="calendar">カレンダー</button>
        <button class="tab-btn" data-view="availability">予定入力</button>
        <button class="tab-btn admin-only" data-view="staff" hidden>スタッフ管理</button>
      </nav>
      <div class="user-info">
        <span id="user-label"></span>
        <button id="logout-btn">ログアウト</button>
      </div>
    </header>

    <main id="view-root"></main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/calendar.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
