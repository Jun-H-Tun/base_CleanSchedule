name = "cleanschedule"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers Static Assets: serves the frontend (public/) directly from
# this Worker, so a single `wrangler deploy` publishes both the API and the
# TimeTree-style calendar UI (no separate Cloudflare Pages project needed).
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "cleanschedule-db"
database_id = "e3168c7b-05f6-4c04-8cf3-4d0ec78cfd4d"
migrations_dir = "migrations"

# 毎日 JST 10:30 (UTC 01:30) に自動割り振りを実行する(src/index.ts の scheduled ハンドラ)。
# beds24の予約データ取り込み(ローカルのCowork「ルーティン」が毎日JST 10:00に実行)より
# 後ろに設定し、その日の最新データを反映してから割り振りが走るようにしている。
# 時刻を変更したい場合はこの値を編集してください(UTC指定, 分 時 日 月 曜日)。
[triggers]
crons = ["30 1 * * *"]

# Secrets (set with `wrangler secret put <NAME>`, never committed):
#   JWT_SECRET       - random string used to sign session cookies
#   INGEST_API_KEY   - shared key the beds24 sync (Claude in Chrome -> Claude Code)
#                      sends as `X-Api-Key` when calling POST /api/reservations/upsert
